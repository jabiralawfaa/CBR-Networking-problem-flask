<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hasil diagnosa – BTS Diagnosa</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><div class="app">
<aside class="side"><div class="brand">BTS · DIAGNOSA</div><a class="btn full" href="diagnosa.html">Diagnosa baru</a><nav class="nav"><a href="welcome.html">Beranda</a><a href="diagnosa.html">Diagnosa</a><a href="hasil.html" class="on">Hasil diagnosa</a></nav><small>Metode: cosine similarity<br>24 gejala, 9 diagnosis</small></aside>
<main class="main">
<div class="crumb"><a href="welcome.html">Beranda</a> / <a href="diagnosa.html">Diagnosa</a> / Hasil</div>
<h1>Hasil diagnosa</h1>
<div id="out"></div>
</main></div>
<script src="data.js"></script>
<script>
let k;try{k=JSON.parse(sessionStorage.getItem('kasus'))}catch(e){}
const demo=!k;if(demo)k={posisi:'Contoh: Site BTS',gejala:[0,1,3,20]}; // kasus uji dari cbr.py
const vec=GEJALA.map((_,i)=>k.gejala.includes(i)?1:0),res=rekomendasi(vec),top=res[0];
function radar(){const n=res.length,cx=200,cy=160,R=100,ord=[...res].sort((a,b)=>a.kode.slice(1)-b.kode.slice(1));
 const pt=(i,v)=>{const a=-Math.PI/2+2*Math.PI*i/n;return[(cx+R*v*Math.cos(a)).toFixed(1),(cy+R*v*Math.sin(a)).toFixed(1)]};let s='';
 [.25,.5,.75,1].forEach(v=>s+=`<polygon points="${ord.map((_,i)=>pt(i,v)).join(' ')}" fill="none" stroke="rgba(255,255,255,.1)"/>`);
 ord.forEach((r,i)=>{const[x,y]=pt(i,1),[lx,ly]=pt(i,1.2);s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(255,255,255,.08)"/><text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="10.5" fill="#a0958d">${r.nama}</text>`});
 s+=`<polygon points="${ord.map((r,i)=>pt(i,r.skor/100)).join(' ')}" fill="rgba(220,63,12,.42)" stroke="#e9b23b" stroke-width="1.6"/>`;
 ord.forEach((r,i)=>{const[x,y]=pt(i,r.skor/100);s+=`<circle cx="${x}" cy="${y}" r="3" fill="#ff6a35"/>`});
 return `<svg viewBox="0 0 400 320" role="img" aria-label="Radar skor kemiripan tiap diagnosis" style="width:100%;height:auto">${s}</svg>`}
const sel=k.gejala.map(i=>`<span class="chip">${GEJALA[i]}</span>`).join('');
let h=demo?'<div class="banner">Ini data contoh. Jalankan diagnosa baru untuk melihat hasil kasus Anda.</div>':'';
h+=`<div class="meta"><div><span>Posisi server</span><b>${k.posisi||'-'}</b></div><div><span>Gejala dipilih</span><b>${k.gejala.length}</b></div><div><span>Waktu diagnosa</span><b>${new Date().toLocaleString('id-ID')}</b></div></div>`;
if(!top.skor){h+=`<section class="panel empty"><h2>Belum ada pola yang cocok</h2><p class="muted" style="margin-bottom:16px">Gejala yang dipilih tidak termasuk pola gangguan mana pun. Coba tambah atau ubah gejala.</p><a class="btn" href="diagnosa.html">Ubah gejala</a></section>`}
else{const tie=res.filter(r=>r.skor===top.skor).length;
h+=`<div class="g2"><section class="panel"><span class="kode">${top.kode}</span><h2 style="font-size:24px;margin:10px 0 14px">${top.nama}</h2>
<div class="big">${fmt(top.skor)}%</div><p class="muted" style="margin:6px 0 16px">kemiripan dengan kasus Anda</p>
<p>Cocok dengan <b>${top.cocok.length}</b> dari <b>${top.idx.length}</b> gejala pola ini.</p>
${tie>1?`<p class="muted" style="margin-top:6px">${tie} diagnosis berbagi skor tertinggi yang sama. Lihat daftar di bawah.</p>`:''}
<h2 style="margin:18px 0 8px">Gejala yang Anda pilih</h2><div class="chips">${sel}</div></section>
<section class="panel"><h2>Peta kemiripan</h2>${radar()}</section></div>`}
h+=`<section class="panel"><h2>Peringkat diagnosis</h2>${res.map(r=>`<details class="rk"${r.peringkat===1?' open':''}><summary><span class="muted">${r.peringkat}</span><span class="kode">${r.kode}</span><span>${r.nama}</span><span class="bar"><i style="width:${r.skor}%"></i></span><span class="sc">${fmt(r.skor)}%</span></summary><div class="det"><p class="muted" style="margin-bottom:8px">Gejala dalam pola ini</p><div class="chips">${r.idx.map(i=>`<span class="chip ${vec[i]?'on':'off'}">${GEJALA[i]}${vec[i]?' (cocok)':''}</span>`).join('')}</div></div></details>`).join('')}</section>
<div style="display:flex;gap:10px;margin-top:16px"><a class="btn" href="diagnosa.html">Diagnosa ulang</a><button class="btn ghost" onclick="print()">Cetak hasil</button></div>`;
document.getElementById('out').innerHTML=h;
</script>
<script src="cyber-bg.js" data-opacity=".28"></script>
</body></html>
