<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc3f0c"/>
      <stop offset="100%" style="stop-color:#ff6a35"/>
    </linearGradient>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff6a35;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#dc3f0c;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <!-- Radar/scope background -->
  <circle cx="32" cy="32" r="26" fill="#0d0908" stroke="url(#grad3)" stroke-width="2"/>
  <!-- Crosshairs -->
  <line x1="32" y1="6" x2="32" y2="58" stroke="url(#grad3)" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
  <line x1="6" y1="32" x2="58" y2="32" stroke="url(#grad3)" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
  <!-- Concentric circles -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="url(#grad3)" stroke-width="0.5" opacity="0.3"/>
  <circle cx="32" cy="32" r="10" fill="none" stroke="url(#grad3)" stroke-width="0.5" opacity="0.3"/>
  <!-- Cosine similarity arc bars (4 quadrants) -->
  <g fill="url(#grad3)">
    <path d="M32,32 L40,32 A8,8 0 0,1 32,40 Z"/>  <!-- 90deg -->
    <path d="M32,32 L48,32 A16,16 0 0,1 32,48 Z"/> <!-- larger -->
    <path d="M32,32 L52,32 A20,20 0 0,1 32,52 Z"/> <!-- largest -->
  </g>
  <!-- Center target -->
  <circle cx="32" cy="32" r="6" fill="url(#pulse)"/>
  <circle cx="32" cy="32" r="3" fill="#fff"/>
  <!-- Diagnosis checkmark -->
  <path d="M24,32 L30,38 L40,26" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
</svg>