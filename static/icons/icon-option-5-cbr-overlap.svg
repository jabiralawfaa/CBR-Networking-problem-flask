<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc3f0c"/>
      <stop offset="100%" style="stop-color:#ff6a35"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Circle background -->
  <circle cx="32" cy="32" r="28" fill="#0d0908" stroke="url(#grad5)" stroke-width="2"/>
  <!-- Two overlapping circles (case-based reasoning: case A & case B) -->
  <circle cx="24" cy="32" r="14" fill="url(#grad5)" opacity="0.25" filter="url(#glow)"/>
  <circle cx="40" cy="32" r="14" fill="url(#grad5)" opacity="0.25" filter="url(#glow)"/>
  <!-- Intersection highlight (cosine similarity) -->
  <ellipse cx="32" cy="32" rx="8" ry="10" fill="url(#grad5)" opacity="0.6"/>
  <!-- Checkmark in intersection -->
  <path d="M28,32 L31,35 L36,28" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Signal indicators around -->
  <g stroke="url(#grad5)" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M32,6 L32,10"/>
    <path d="M32,54 L32,58"/>
    <path d="M6,32 L10,32"/>
    <path d="M54,32 L58,32"/>
    <path d="M14,14 L17,17"/>
    <path d="M47,47 L50,50"/>
    <path d="M14,50 L17,47"/>
    <path d="M47,17 L50,14"/>
  </g>
</svg>