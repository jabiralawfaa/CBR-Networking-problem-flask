<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc3f0c"/>
      <stop offset="100%" style="stop-color:#ff6a35"/>
    </linearGradient>
  </defs>
  <!-- Tower structure -->
  <rect x="28" y="8" width="8" height="48" rx="2" fill="url(#grad1)"/>
  <!-- Cross arms -->
  <rect x="16" y="18" width="32" height="4" rx="2" fill="url(#grad1)"/>
  <rect x="16" y="42" width="32" height="4" rx="2" fill="url(#grad1)"/>
  <!-- Antenna dishes -->
  <ellipse cx="14" cy="16" rx="6" ry="3" fill="#1a1614" stroke="url(#grad1)" stroke-width="1.5"/>
  <ellipse cx="50" cy="16" rx="6" ry="3" fill="#1a1614" stroke="url(#grad1)" stroke-width="1.5"/>
  <ellipse cx="14" cy="44" rx="6" ry="3" fill="#1a1614" stroke="url(#grad1)" stroke-width="1.5"/>
  <ellipse cx="50" cy="44" rx="6" ry="3" fill="#1a1614" stroke="url(#grad1)" stroke-width="1.5"/>
  <!-- Signal waves -->
  <g stroke="#ff6a35" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M32 56 Q26 60 20 60"/>
    <path d="M32 56 Q38 60 44 60"/>
  </g>
  <!-- Center pulse -->
  <circle cx="32" cy="32" r="6" fill="#fff" opacity="0.2"/>
  <circle cx="32" cy="32" r="3" fill="#ff6a35"/>
</svg>