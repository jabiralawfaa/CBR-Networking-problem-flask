<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="/static/favicon.svg">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="apple-touch-icon" href="/static/favicon.svg">
  <title>{% block title %}BTS Diagnosa{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">BTS · DIAGNOSA</div>
      <a class="btn full" href="/diagnosa">Diagnosa baru</a>
      <nav class="nav">
        <a href="/" class="{% if request.path == '/' %}on{% endif %}">Beranda</a>
        <a href="/diagnosa" class="{% if request.path == '/diagnosa' %}on{% endif %}">Diagnosa</a>
        <a href="/riwayat" class="{% if request.path == '/riwayat' %}on{% endif %}">Riwayat</a>
        <a href="/kelola" class="{% if request.path == '/kelola' %}on{% endif %}">Kelola data</a>
      </nav>
      <small>Metode: cosine similarity<br>{{ gejala_count }} gejala, {{ diagnosis_count }} diagnosis</small>
    </aside>
    <main class="main">
      {% block content %}{% endblock %}
    </main>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
